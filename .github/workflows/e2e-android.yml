name: Swap Android

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/e2e-android.yml'
      - 'scripts/e2e-android.sh'
      - 'android/**'
      - 'src/**'
      - 'example/**'
  pull_request:
    paths:
      - '.github/workflows/e2e-android.yml'
      - 'scripts/e2e-android.sh'
      - 'android/**'
      - 'src/**'
      - 'example/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swap:
    name: Swap Into A Running App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install the library (bun)
        run: bun install --frozen-lockfile

      # The example links the library with file:.., so it installs on its own and npm has to
      # find lib/ already built by the library's prepare script.
      - name: Install the example (npm)
        working-directory: example
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The emulator needs hardware acceleration to be usable, and the runner ships
      # KVM disabled for everyone but root.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Swap into a running app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/e2e-android.sh

      - name: What the watcher said
        if: failure()
        run: adb logcat -d -s Hotswap Probe AppProbe | tail -60 || true

      - name: Stop Gradle daemon
        if: always()
        working-directory: example/android
        run: ./gradlew --stop || true
